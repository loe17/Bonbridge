<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <style>
    .box{fill:#ffffff;stroke:#2a2f3a;stroke-width:2;rx:8}
    .accent{fill:#eaf2fe;stroke:#4f9cf9;stroke-width:2}
    .warnbox{fill:#fff6e6;stroke:#f5b451;stroke-width:2}
    .t{font-size:14px;fill:#1a1d23}
    .tb{font-size:15px;fill:#1a1d23;font-weight:600}
    .ts{font-size:12px;fill:#5b6472}
    .wire{stroke:#2a2f3a;stroke-width:3;fill:none}
    .power{stroke:#f2555a;stroke-width:3;fill:none}
    .data{stroke:#4f9cf9;stroke-width:3;fill:none}
    .radio{stroke:#3ecf8e;stroke-width:3;fill:none;stroke-dasharray:7 5}
  </style>
  <rect width="900" height="560" fill="#f5f6f8"/>
  <text x="24" y="34" class="tb" font-size="19">BonBridge – Anschlussplan USB / USB wiring diagram</text>
  <text x="24" y="54" class="ts">Standardfall: Raspberry Pi Zero 2 W + Epson TM-T88V (USB) · standard case</text>

  <!-- Mains -->
  <rect x="30" y="90" width="150" height="52" class="box"/>
  <text x="46" y="113" class="t">230 V Steckdose</text>
  <text x="46" y="131" class="ts">mains socket</text>

  <rect x="30" y="330" width="150" height="52" class="box"/>
  <text x="46" y="353" class="t">230 V Steckdose</text>
  <text x="46" y="371" class="ts">mains socket</text>

  <!-- PSUs -->
  <rect x="220" y="84" width="180" height="64" class="box"/>
  <text x="236" y="107" class="t">Netzteil 5 V / 2,5 A</text>
  <text x="236" y="125" class="ts">Micro-USB power supply</text>
  <text x="236" y="141" class="ts">Pi 4/5: USB-C</text>

  <rect x="220" y="322" width="180" height="68" class="warnbox"/>
  <text x="236" y="345" class="t">Epson PS-180 · 24 V</text>
  <text x="236" y="363" class="ts">ZWINGEND eigenes Netzteil</text>
  <text x="236" y="379" class="ts">mandatory, USB cannot power it</text>

  <!-- Pi -->
  <rect x="450" y="70" width="220" height="180" class="accent"/>
  <text x="466" y="96" class="tb">Raspberry Pi Zero 2 W</text>
  <text x="466" y="120" class="ts">äußere Micro-USB-Buchse:</text>
  <text x="466" y="136" class="t">PWR IN  ← 5 V</text>
  <text x="466" y="162" class="ts">innere Micro-USB-Buchse:</text>
  <text x="466" y="178" class="t">USB  → OTG-Adapter</text>
  <text x="466" y="206" class="ts">Pi 3/4/5: normale USB-A-Buchse</text>
  <text x="466" y="222" class="ts">Pi 4: schwarze USB-2.0-Ports</text>
  <text x="466" y="240" class="ts">WLAN / LAN → Router</text>

  <!-- OTG -->
  <rect x="450" y="270" width="220" height="52" class="box"/>
  <text x="466" y="292" class="t">USB-OTG-Adapter</text>
  <text x="466" y="310" class="ts">Micro-USB → USB-A (nur Pi Zero)</text>

  <!-- Printer -->
  <rect x="720" y="290" width="155" height="150" class="accent"/>
  <text x="734" y="315" class="tb">Epson TM-T88V</text>
  <text x="734" y="338" class="t">USB Typ B</text>
  <text x="734" y="354" class="ts">Board UB-U03II/U05/U06</text>
  <text x="734" y="378" class="t">DC 24 V</text>
  <text x="734" y="402" class="t">DK (RJ11)</text>
  <text x="734" y="418" class="ts">→ Kassenlade (optional)</text>
  <text x="734" y="434" class="ts">MODE = ESC/POS</text>

  <!-- Router / phone -->
  <rect x="720" y="70" width="155" height="60" class="box"/>
  <text x="736" y="93" class="t">Router / AP</text>
  <text x="736" y="111" class="ts">gleiches (W)LAN</text>

  <rect x="720" y="160" width="155" height="76" class="box"/>
  <text x="736" y="183" class="t">Tablet / Handy</text>
  <text x="736" y="201" class="ts">OrderAssist</text>
  <text x="736" y="221" class="ts">Drucker-IP eintragen</text>

  <!-- Wires -->
  <path class="power" d="M180 116 H220"/>
  <path class="power" d="M400 116 H450"/>
  <path class="power" d="M180 356 H220"/>
  <path class="power" d="M400 356 H720"/>
  <path class="data"  d="M560 250 V270"/>
  <path class="data"  d="M670 296 H700 V330 H720"/>
  <path class="radio" d="M670 232 H700 V100 H720"/>
  <path class="radio" d="M797 130 V160"/>

  <!-- Legend -->
  <rect x="30" y="440" width="845" height="94" class="box"/>
  <text x="46" y="464" class="tb">Legende / legend</text>
  <path class="power" d="M46 482 H86"/><text x="94" y="487" class="ts">Stromversorgung / power</text>
  <path class="data"  d="M280 482 H320"/><text x="328" y="487" class="ts">USB-Datenleitung / USB data</text>
  <path class="radio" d="M540 482 H580"/><text x="588" y="487" class="ts">WLAN / Netzwerk</text>
  <text x="46" y="512" class="ts">Häufigster Fehler: Netzteil an der falschen Micro-USB-Buchse des Pi Zero. Die äußere ist PWR IN, die innere ist USB.</text>
  <text x="46" y="528" class="ts">Most common mistake: power on the wrong Micro-USB socket of the Pi Zero. The outer one is PWR IN, the inner one is USB.</text>
</svg>
