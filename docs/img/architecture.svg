<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <style>
    .box{fill:#ffffff;stroke:#2a2f3a;stroke-width:2}
    .accent{fill:#eaf2fe;stroke:#4f9cf9;stroke-width:2}
    .green{fill:#e9faf2;stroke:#3ecf8e;stroke-width:2}
    .grey{fill:#f0f2f5;stroke:#98a0ad;stroke-width:2;stroke-dasharray:6 4}
    .t{font-size:14px;fill:#1a1d23}
    .tb{font-size:15px;fill:#1a1d23;font-weight:600}
    .ts{font-size:12px;fill:#5b6472}
    .arrow{stroke:#4f9cf9;stroke-width:2.5;fill:none;marker-end:url(#a)}
    .arrow2{stroke:#3ecf8e;stroke-width:2.5;fill:none;marker-end:url(#b)}
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#4f9cf9"/>
    </marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#3ecf8e"/>
    </marker>
  </defs>
  <rect width="920" height="520" fill="#f5f6f8"/>
  <text x="24" y="32" class="tb" font-size="18">BonBridge – Architektur / architecture</text>

  <!-- clients -->
  <rect x="24" y="70" width="150" height="60" rx="8" class="box"/>
  <text x="38" y="94" class="t">OrderAssist</text>
  <text x="38" y="112" class="ts">Küche / kitchen</text>

  <rect x="24" y="150" width="150" height="60" rx="8" class="box"/>
  <text x="38" y="174" class="t">OrderAssist</text>
  <text x="38" y="192" class="ts">Theke / bar</text>

  <rect x="24" y="230" width="150" height="60" rx="8" class="box"/>
  <text x="38" y="254" class="t">Browser</text>
  <text x="38" y="272" class="ts">Weboberfläche</text>

  <rect x="24" y="320" width="150" height="70" rx="8" class="grey"/>
  <text x="38" y="344" class="t">CUPS (optional)</text>
  <text x="38" y="362" class="ts">Desktop / AirPrint</text>
  <text x="38" y="380" class="ts">socket://127.0.0.1:9100</text>

  <!-- device -->
  <rect x="236" y="56" width="470" height="404" rx="12" class="accent" fill="#fbfdff"/>
  <text x="252" y="80" class="tb">BonBridge-Gerät (Pi Zero 2 W / Pi 3-5 / x86)</text>

  <rect x="256" y="96" width="190" height="54" rx="8" class="box"/>
  <text x="270" y="118" class="t">RAW-Listener :9100</text>
  <text x="270" y="136" class="ts">IP A (Drucker 1)</text>

  <rect x="256" y="160" width="190" height="54" rx="8" class="box"/>
  <text x="270" y="182" class="t">RAW-Listener :9100</text>
  <text x="270" y="200" class="ts">IP B (Drucker 2)</text>

  <rect x="256" y="228" width="190" height="54" rx="8" class="box"/>
  <text x="270" y="250" class="t">Web-UI + REST :8080</text>
  <text x="270" y="268" class="ts">Status, Diagnose, Setup</text>

  <rect x="256" y="296" width="190" height="66" rx="8" class="box"/>
  <text x="270" y="318" class="t">Job-Queue + Spool</text>
  <text x="270" y="336" class="ts">Retry, kein Auftragsverlust</text>
  <text x="270" y="354" class="ts">retry, no lost jobs</text>

  <rect x="472" y="96" width="216" height="118" rx="8" class="green"/>
  <text x="486" y="118" class="tb">Printer-Worker</text>
  <text x="486" y="138" class="ts">genau ein Besitzer je Drucker</text>
  <text x="486" y="154" class="ts">exactly one owner per printer</text>
  <text x="486" y="176" class="t">Transport</text>
  <text x="486" y="194" class="ts">usb (libusb) · usblp</text>
  <text x="486" y="208" class="ts">serial · network</text>

  <rect x="472" y="228" width="216" height="134" rx="8" class="box"/>
  <text x="486" y="250" class="tb">Capability-Engine</text>
  <text x="486" y="270" class="ts">USB-Deskriptor / IEEE-1284</text>
  <text x="486" y="286" class="ts">GS I  (Drucker-ID)</text>
  <text x="486" y="302" class="ts">DLE EOT (Live-Status)</text>
  <text x="486" y="318" class="ts">escpos-printer-db (vendored)</text>
  <text x="486" y="336" class="ts">→ Funktionen + Empfehlung</text>
  <text x="486" y="352" class="ts">   font / Zeichensatz / Breite</text>

  <rect x="256" y="376" width="432" height="68" rx="8" class="box"/>
  <text x="270" y="398" class="t">Konfiguration /etc/bonbridge/config.yaml · systemd · mDNS</text>
  <text x="270" y="418" class="ts">Overrides je Funktion, IP-Bindung je Drucker, Logs</text>
  <text x="270" y="436" class="ts">per-feature overrides, per-printer IP binding, logs</text>

  <!-- printers -->
  <rect x="744" y="96" width="152" height="80" rx="8" class="accent"/>
  <text x="758" y="120" class="t">Bondrucker 1</text>
  <text x="758" y="138" class="ts">USB / ESC-POS</text>
  <text x="758" y="158" class="ts">TM-T88V</text>

  <rect x="744" y="196" width="152" height="80" rx="8" class="accent"/>
  <text x="758" y="220" class="t">Bondrucker 2</text>
  <text x="758" y="238" class="ts">USB / seriell /</text>
  <text x="758" y="256" class="ts">Netzwerk</text>

  <!-- arrows -->
  <path class="arrow" d="M174 100 H256"/>
  <path class="arrow" d="M174 180 H256"/>
  <path class="arrow" d="M174 260 H256"/>
  <path class="arrow" d="M174 350 H210 V123 H256"/>
  <path class="arrow" d="M446 123 H472"/>
  <path class="arrow" d="M446 187 H460 V150 H472"/>
  <path class="arrow" d="M446 329 H460 V214 H472"/>
  <path class="arrow2" d="M688 136 H744"/>
  <path class="arrow2" d="M688 160 V236 H744"/>
  <path class="arrow2" d="M744 250 H710 V300 H688" stroke-dasharray="5 4"/>
  <text x="700" y="292" class="ts" text-anchor="end">Status</text>

  <text x="24" y="490" class="ts">Kernprinzip: Nur der Printer-Worker öffnet das Druckergerät – CUPS und Kassensystem können sich nicht mehr in die Quere kommen.</text>
  <text x="24" y="508" class="ts">Key principle: only the printer worker opens the device, so CUPS and the POS application can no longer interleave their output.</text>
</svg>
