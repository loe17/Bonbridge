name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 = Debian 11 (bullseye), 3.11 = Debian 12 (bookworm),
        # 3.12 = Ubuntu 24.04, 3.13 = Debian 13 (trixie) / current Ubuntu.
        # 3.12 is where typing.Pattern was removed - keep it in the matrix.
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pyusb pyserial

      - name: Byte-compile everything
        run: python -m compileall -q src tests

      - name: Import check
        run: |
          PYTHONPATH=src python - <<'PY'
          import bonbridge, bonbridge.caps as caps, bonbridge.escpos as escpos
          from bonbridge.config import Config
          from bonbridge.daemon import BonBridge
          from bonbridge.web.server import WebApplication
          print("BonBridge", bonbridge.__version__)
          assert caps.recommend_pos_settings("TM-T88V")["columns"] == 56
          assert escpos.cut() == b"\x1dVB\x60"
          print("ok")
          PY

      - name: End-to-end test (mock printer)
        run: python tests/test_end_to_end.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install ruff

      # Real gate, not advisory: the rule set is pinned in ruff.toml so that a
      # new ruff release cannot turn the job red (or, worse, demand syntax that
      # Python 3.9 on Raspberry Pi OS Bullseye does not understand).
      - name: ruff
        run: ruff check src tests

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning install.sh uninstall.sh \
            packaging/bin/bonbridge-ip packaging/cups/setup-cups.sh

  install:
    name: Installer smoke test (Debian container)
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      # NOTE: a container has no systemd as PID 1.  The installer detects that
      # via /run/systemd/system, installs the unit files anyway and skips
      # enable/start - this job exists to keep that path working.
      - name: Prepare container
        run: |
          apt-get update -qq
          apt-get install -y -qq ca-certificates git

      - uses: actions/checkout@v4

      - name: Run the installer without starting the service
        run: bash install.sh --no-start
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Everything must be in place
        run: |
          test -x /usr/local/bin/bonbridge
          test -f /etc/systemd/system/bonbridge.service
          test -f /etc/systemd/system/bonbridge-ip@.service
          test -f /etc/bonbridge/config.yaml
          test -f /opt/bonbridge/vendor/escpos-printer-db/capabilities.json
          test -f /opt/bonbridge/docs/de/09-referenzen.md
          bonbridge --version
          bonbridge scan

      - name: Uninstall must also work without systemd
        run: |
          bash /opt/bonbridge/uninstall.sh --purge
          test ! -d /opt/bonbridge
          test ! -f /etc/systemd/system/bonbridge.service
