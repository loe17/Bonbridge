notes_de: |
  Sammelprofil fuer unbekannte 58-mm-Drucker. Viele Geraete dieser Klasse
  haben keinen Cutter und keine Kassenladen-Buchse - beides in der
  Weboberflaeche abschalten, wenn es nicht vorhanden ist.
notes_en: |
  Catch-all profile for unknown 58 mm printers. Many of them have neither a
  cutter nor a cash drawer connector - switch both off in the web interface if
  the hardware does not have them.
